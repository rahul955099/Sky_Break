# Render Blueprint — Skybreak Infra Pvt Ltd API on Render's FREE plan.
# Database: Neon Free (external PostgreSQL). Email: Brevo SMTP relay.
# Apply from the Render dashboard: New → Blueprint → select this repository.
#
# No secrets are stored here (this repository is public):
#   - SESSION_SECRET is generated by Render.
#   - "sync: false" values are typed into the dashboard when the Blueprint is first created
#     (Render does not prompt for them again on later syncs — edit them under Environment).
#
# Free-plan facts this file is built around (render.com/docs/free, /docs/deploys):
#   - No pre-deploy command, no persistent disk and no Shell on free instances.
#   - Outbound SMTP on ports 25, 465 and 587 is blocked, so Brevo is used on port 2525.
#   - The service spins down after 15 minutes without traffic; the next request waits ~1 minute.

services:
  - type: web
    name: skybreak-api
    runtime: node # Node version comes from .node-version (22)
    plan: free
    # Nearest Render region to India. Create the Neon project in the same region
    # (AWS Asia Pacific – Singapore) to keep database latency low. Change both together.
    region: singapore
    # 1. Install (devDependencies are needed for TypeScript and the Prisma CLI; NODE_ENV=production
    #    below would otherwise make npm skip them).
    # 2. Generate the Prisma client and compile the server.
    # 3. Apply pending migrations with `prisma migrate deploy` — it never resets or deletes data and
    #    does not seed. It runs during the build because the free plan has no pre-deploy step:
    #    if a migration fails, the build fails, Render cancels the deploy and the current version
    #    keeps serving traffic. Keep migrations backward-compatible (add before you remove),
    #    because they are applied while the previous version is still live.
    buildCommand: npm ci --include=dev && npm run build -w server && npm run db:deploy -w server
    startCommand: npm run start -w server
    # Liveness only (answers without the database). Use /api/health to check the database too.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Neon connection string: use the DIRECT (non-pooled) string — host without "-pooler" —
      # ending in ?sslmode=require. It is used both by the app and by `prisma migrate deploy`.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"

      # Server-side key for hashing stored IP addresses and email verification codes (login
      # sessions use separate random tokens). Rotating it invalidates email codes still pending.
      - key: SESSION_SECRET
        generateValue: true

      # The site's exact origin(s), comma-separated, no trailing slash. Add a custom domain here
      # later (e.g. ",https://www.your-domain.example") — POSTs from other origins are rejected.
      - key: CLIENT_URL
        value: https://skybreak-infra.netlify.app
      # Canonical public URL used in sitemap.xml and robots.txt.
      - key: PUBLIC_SITE_URL
        value: https://skybreak-infra.netlify.app
      # Browser → Netlify proxy → Render load balancer → app = 2 trusted proxy hops.
      - key: TRUST_PROXY
        value: "2"
      # First-party session cookie via the Netlify proxy (keep "strict").
      - key: COOKIE_SAMESITE
        value: strict
      - key: SERVE_CLIENT
        value: "false"

      # ── Email (Brevo SMTP relay) ────────────────────────────────────────────────
      # Enter "smtp" once Brevo is set up; enter "none" to run without email (customers without an
      # Indian mobile number are then asked to use one, because email codes can't be sent).
      # With "smtp", the server refuses to start unless EMAIL_FROM and ENQUIRY_NOTIFY_TO are set.
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      # 2525 because Render's free plan blocks 25/465/587. Not implicit TLS: the connection is
      # upgraded with STARTTLS when Brevo offers it.
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      # Brevo → Settings → SMTP & API → SMTP tab: the "Login" value and an SMTP key
      # (an SMTP key, not an API key).
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # A sender verified in Brevo, e.g. "Skybreak Infra Pvt Ltd <sender@your-verified-domain>".
      - key: EMAIL_FROM
        sync: false
      # Where new-enquiry alerts are sent (kept out of this public file).
      - key: ENQUIRY_NOTIFY_TO
        sync: false
      # Reject enquiry emails whose domain cannot receive mail.
      - key: EMAIL_DOMAIN_CHECK
        value: "true"

    # Uploaded images go to server/uploads, which is wiped on every redeploy, restart and
    # spin-down on the free plan (no persistent disks). Use image URLs in the admin instead.

# No `databases:` section — PostgreSQL is provided by Neon, not Render.
